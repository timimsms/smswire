name: Release

# Run from the Actions tab after the version bump is merged to main.
# `rake release` builds the gem, creates and pushes the vX.Y.Z tag, and
# publishes to RubyGems with trusted publishing (rubygems/release-gem).
on:
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write # push the release tag
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake test
      - uses: rubygems/release-gem@v1
